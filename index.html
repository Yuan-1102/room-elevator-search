(()=>{'use strict';const KEY='deliveryManagerV2',OLD='elevatorFinderDataV1';const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));const clean=s=>String(s??'').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,9);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.buildings)||!Array.isArray(data.packages))data=clone(window.INITIAL_DELIVERY_DATA);if(!data.shifts)data.shifts={};if(!data.collapsed)data.collapsed={};if(!data.buildings.some(b=>b.id===data.activeBuilding))data.activeBuilding=data.buildings[0]?.id;data.offices||=[{id:'yamato-a',name:'ヤマト運輸（A）',mode:'piece',parcelRate:150,nekoposRate:40},{id:'yamato-b',name:'ヤマト運輸（B）',mode:'piece',parcelRate:150,nekoposRate:40},{id:'chiba-a',name:'千葉通商（A）',mode:'fixed',dailyRate:17000},{id:'chiba-b',name:'千葉通商（B）',mode:'fixed',dailyRate:17000}];data.workEntries||=[];data.expenses||=[];data.paySettings||={closingDay:'end',leaseFee:60000};data.history||={};data.ui||={};data.ui.filter||='all';data.ui.workSort||='desc';data.ui.statsOpen||=false;data.ui.lastBackup||=0;data.shiftOffices||={};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('端末に保存できません。バックアップを作成してください。')}};const bld=()=>data.buildings.find(b=>b.id===data.activeBuilding);const pkgFor=()=>data.packages.filter(p=>p.buildingId===data.activeBuilding);const getRoom=(b,n)=>b?.rooms.find(r=>r.room===String(n));const roomSort=(a,b)=>Number(a.room)-Number(b.room)||a.room.localeCompare(b.room);let activeRoom=null;let shiftMonth=new Date();shiftMonth.setDate(1);let editingShift=false;let settingsId=null;let noticeTimer;let workMonth=new Date();workMonth.setDate(1);let draftTimer;let undoState=null;let expandedPkg=null;let shiftSelectedDay=null;let photoBuffer=[];let editingWorkId=null;

function period(){const y=workMonth.getFullYear(),m=workMonth.getMonth(),day=data.paySettings.closingDay;let start,end;if(day==='end'){start=new Date(y,m,1);end=new Date(y,m+1,1)}else{const d=Number(day);start=new Date(y,m-1,d+1);end=new Date(y,m,d+1)}const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;return {start:fmt(start),end:fmt(end),label:`${start.getMonth()+1}/${start.getDate()}〜${new Date(end.getTime()-86400000).getMonth()+1}/${new Date(end.getTime()-86400000).getDate()}`}}
function entryAmount(e){return Number(e.amount)||0}function renderWork(){const pr=period();$('workTitle').textContent=`${workMonth.getFullYear()}年${workMonth.getMonth()+1}月分`;const entries=data.workEntries.filter(e=>e.date>=pr.start&&e.date<pr.end).sort((a,b)=>(data.ui.workSort==='asc'?1:-1)*a.date.localeCompare(b.date)),expenses=data.expenses.filter(e=>e.date>=pr.start&&e.date<pr.end).sort((a,b)=>b.date.localeCompare(a.date)),gross=entries.reduce((n,e)=>n+entryAmount(e),0),expenseSum=expenses.reduce((n,e)=>n+Number(e.amount||0),0),lease=Number(data.paySettings.leaseFee)||0;const fmtDate=s=>`${Number(s.slice(5,7))}/${Number(s.slice(8,10))}`;$('workSummary').innerHTML=`<div class="summarybox"><div class="muted">稼働報酬合計（${pr.label}）</div><strong>${money(gross)}</strong><div class="muted">稼働日数：${new Set(entries.map(e=>e.date)).size}日</div><div class="payrow"><span>車両リース代</span><span>−${money(lease)}</span></div><div class="payrow"><span>その他経費</span><span>−${money(expenseSum)}</span></div><hr><div class="payrow"><b>経費差引後の見込額</b><b>${money(gross-lease-expenseSum)}</b></div><small class="muted">税金等は含まれません</small></div>`;const byOffice={};for(const e of entries){const k=e.officeId;byOffice[k]||={name:e.officeName||'営業所',amount:0,days:0};byOffice[k].amount+=entryAmount(e);byOffice[k].days++}$('officeSummary').innerHTML=Object.values(byOffice).map(x=>`<div class="payrow"><span>${esc(x.name)} <small class="muted">${x.days}件</small></span><strong>${money(x.amount)}</strong></div>`).join('')||'<p class="muted">実績がありません</p>';$('workEntries').innerHTML=entries.map(e=>`<div class="workentry"><div class="row"><strong>${fmtDate(e.date)}　${esc(e.officeName)}</strong><strong>${money(e.amount)}</strong></div>${e.memo?`<div class="muted">${esc(e.memo)}</div>`:''}${e.photos?.length?`<button class="small" data-workphotos="${esc(e.id)}">📷 写真 ${e.photos.length}枚</button>`:''}${e.mode==='piece'?`<small>宅急便　配完 ${e.parcelDone||0}件・戻り ${e.parcelReturn||0}件</small><br><small>ネコポス　配完 ${e.nekoDone| $('workPrev').onclick=()=>{workMonth.setMonth(workMonth.getMonth()-1);renderWork()};$('workNext').onclick=()=>{workMonth.setMonth(workMonth.getMonth()+1);renderWork()};const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const DB_NAME='deliveryManagerPhotos',STORE='images';function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function photoPut(id,blob){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}async function photoGet(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE);const req=tx.objectStore(STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}})}async function photoDel(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}async function compressPhoto(file){const img=await createImageBitmap(file);const scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('画像変換に失敗')),'image/jpeg',.75))}
async function photoPreview(ids,container){const el=$(container);if(!el)return;el.innerHTML='';for(const id of ids){try{const blob=await photoGet(id);if(!blob)continue;const url=URL.createObjectURL(blob),wrap=document.createElement('span');wrap.innerHTML=`<img class="photo-thumb" alt="添付写真"><button class="small danger" data-remove-photo="${esc(id)}">×</button>`;wrap.querySelector('img').src=url;wrap.querySelector('img').onclick=()=>window.open(url,'_blank');el.append(wrap)}catch(err){el.textContent='写真を読み込めませんでした'}}}
function workForm(e,fromShiftDate,fromShiftOffice){if(!data.offices.length)return alert('先に営業所を登録してください');const office=data.offices.find(x=>x.id===e?.officeId)||data.offices[0];editingWorkId=e?.id||null;photoBuffer=[...(e?.photos||[])];showModal(e?'稼働実績を編集':'稼働実績を追加',`${field('wDate','稼働日',e?.date||fromShiftDate||today(),'date')}<label>稼働場所</label><select id="wOffice">${data.offices.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select><div id="wFields"></div>${field('wMemo','メモ（任意）',e?.memo||'')}<label>写真（最大3枚）</label><input id="wPhotos" type="file" accept="image/*" multiple><div class="hint">iPhoneのカメラ・写真ライブラリから追加できます。写真は端末内に保存されます。</div><div id="wPhotoList" class="photo-row"></div><div id="wEstimate" class="summarybox"></div><div class="form-actions"><button id="wCancel">キャンセル</button><button class="primary" id="wSave">保存</button></div>`);$('wOffice').value=fromShiftOffice||office.id;const renderFields=()=>{const o=data.offices.find(x=>x.id===$('wOffice').value);$('wFields').innerHTML=o.mode==='piece'?`<h3>宅急便</h3><div class="row"><div class="grow">${field('wParcelDone','配完',e?.parcelDone??0,'number')}</div><div class="grow">${field('wParcelReturn','戻り',e?.parcelReturn??0,'number')}</div></div><h3>ネコポス</h3><div class="row"><div class="grow">${field('wNekoDone','配完',e?.nekoDone??0,'number')}</div><div class="grow">${field('wNekoReturn','戻り',e?.nekoReturn??0,'number')}</div></div><p class="hint">戻りは報酬に含みません。</p>`:`<p class="notice">固定報酬：${money(o.dailyRate)}／登録1件。個数入力は不要です。</p>`;$('wFields').oninput=estimate;estimate()};function estimate(){const o=data.offices.find(x=>x.id===$('wOffice').value);const n=id=>Number($(id)?.value||0);const amount=o.mode==='fixed'?o.dailyRate:n('wParcelDone')*o.parcelRate+n('wNekoDone')*o.nekoposRate;$('wEstimate').innerHTML=`見込み報酬 <strong>${money(amount)}</strong><div class="muted">${esc(o.name)}／戻りは報酬対象外</div>`};$('wOffice').onchange=renderFields;renderFields();photoPreview(photoBuffer,'wPhotoList');$('wPhot function renderMonthCompare(){const rows=[];for(let i=5;i>=0;i--){const d=new Date(workMonth.getFullYear(),workMonth.getMonth()-i,1),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,list=data.workEntries.filter(e=>e.date.startsWith(key));rows.push({key,amount:list.reduce((n,e)=>n+entryAmount(e),0),days:new Set(list.map(e=>e.date)).size})}const max=Math.max(1,...rows.map(r=>r.amount));$('monthCompare').innerHTML=rows.map((r,i)=>`<div style="margin:10px 0"><div class="payrow"><span>${esc(r.key)}（${r.days}日）</span><b>${money(r.amount)} ${i?`<small class="muted">(${r.amount-rows[i-1].amount>=0?'+':''}${money(r.amount-rows[i-1].amount)})</small>`:''}</b></div><div class="monthbar" style="width:${Math.max(1,100*r.amount/max)}%"></div></div>`).join('')}
