(()=>{'use strict';const KEY='deliveryManagerV2',OLD='elevatorFinderDataV1';const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));const clean=s=>String(s??'').trim();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,9);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.buildings)||!Array.isArray(data.packages))data=clone(window.INITIAL_DELIVERY_DATA);if(!data.shifts)data.shifts={};if(!data.collapsed)data.collapsed={};if(!data.buildings.some(b=>b.id===data.activeBuilding))data.activeBuilding=data.buildings[0]?.id;data.offices||=[{id:'yamato-a',name:'ヤマト運輸（A）',mode:'piece',parcelRate:150,nekoposRate:40},{id:'yamato-b',name:'ヤマト運輸（B）',mode:'piece',parcelRate:150,nekoposRate:40},{id:'chiba-a',name:'千葉通商（A）',mode:'fixed',dailyRate:17000},{id:'chiba-b',name:'千葉通商（B）',mode:'fixed',dailyRate:17000}];data.workEntries||=[];data.expenses||=[];data.paySettings||={closingDay:'end',leaseFee:60000};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('端末に保存できません。バックアップを作成してください。')}};const bld=()=>data.buildings.find(b=>b.id===data.activeBuilding);const pkgFor=()=>data.packages.filter(p=>p.buildingId===data.activeBuilding);const getRoom=(b,n)=>b?.rooms.find(r=>r.room===String(n));const roomSort=(a,b)=>Number(a.room)-Number(b.room)||a.room.localeCompare(b.room);let activeRoom=null;let shiftMonth=new Date();shiftMonth.setDate(1);let editingShift=false;let settingsId=null;let noticeTimer;let workMonth=new Date();workMonth.setDate(1);let draftTimer;let undoState=null;

let swipeStart=null;$('packageList').addEventListener('touchstart',e=>{if(e.target.closest('button')){swipeStart=null;return}const t=e.target.closest('[data-swipe]');if(!t)return;const touch=e.changedTouches[0];swipeStart={id:t.dataset.swipe,x:touch.clientX,y:touch.clientY}}, {passive:true});$('packageList').addEventListener('touchend',e=>{if(!swipeStart)return;const t=e.changedTouches[0],dx=t.clientX-swipeStart.x,dy=t.clientY-swipeStart.y,id=swipeStart.id;swipeStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)setPackageStatus(id,dx>0?'delivered':'absent')},{passive:true});

.push({id:uid(),...v});save();renderWork();closeModal();message('保存しました ✓')}}
function expenseForm(e){showModal(e?'経費を編集':'経費を追加',`${field('eDate','日付',e?.date||today(),'date')}${selectField('eKind','種類',['ガソリン代','高速道路代','その他'],e?.kind||'ガソリン代')}${field('eAmount','金額（円）',e?.amount??0,'number')}${field('eMemo','メモ（任意）',e?.memo||'')}<div class="form-actions"><button id="eCancel">キャンセル</button><button class="primary" id="eSave">保存</button></div>`);$('eCancel').onclick=closeModal;$('eSave').onclick=()=>{if(!$('eDate').value)return alert('日付を入力してください');const v={date:$('eDate').value,kind:$('eKind').value,amount:nonneg('eAmount'),memo:clean($('eMemo').value)};if(e)Object.assign(e,v);else data.expenses.push({id:uid(),...v});save();renderWork();closeModal();message('保存しました ✓')}}$('workAdd').onclick=()=>workForm(null);$('expenseAdd').onclick=()=>expenseForm(null);$('workEntries').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const v=data.workEntries.find(x=>x.id===(t.dataset.workedit||t.dataset.workdel));if(!v)return;if(t.dataset.workedit)workForm(v);else if(confirm(`${v.date}の稼働実績を削除しますか？`)){data.workEntries=data.workEntries.filter(x=>x.id!==v.id);save();renderWork()}});$('expenseEntries').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const v=data.expenses.find(x=>x.id===(t.dataset.expedit||t.dataset.expdel));if(!v)return;if(t.dataset.expedit)expenseForm(v);else if(confirm(`${v.date}の経費を削除しますか？`)){data.expenses=data.expenses.filter(x=>x.id!==v.id);save();renderWork()}});
