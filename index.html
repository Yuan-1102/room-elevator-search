<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1457a6">
<title>部屋番号・エレベーター検索</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
*{box-sizing:border-box}body{margin:0}header{background:#1457a6;color:white;padding:22px 16px 18px}
header h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:13px;opacity:.9}
main{max-width:760px;margin:auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
nav button,.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;min-height:44px;cursor:pointer}
nav button{background:#e2eaf5;color:#17406f}nav button.active,.primary{background:#1457a6;color:white}
.panel{background:white;border:1px solid #dce4ef;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
input,select{width:100%;min-height:46px;border:1px solid #bdcbe0;border-radius:10px;padding:10px 12px;font:inherit;background:white}
.row{display:flex;gap:8px;align-items:end}.row>div{flex:1;min-width:0}
.btn{width:100%;margin-top:12px}.secondary{background:#e8eef7;color:#183c69}.danger{background:#fff0f0;color:#a32121}
.result{background:#edf6ff;border:1px solid #c7e0ff;border-radius:14px;padding:18px;margin-top:14px}
.room{font-size:25px;font-weight:800}.elevator{font-size:30px;font-weight:900;color:#1457a6;margin:5px 0}
.small{font-size:13px;color:#53627a}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #e4eaf2;padding:12px 0}
.item:first-child{border-top:0}.item strong{display:block}.item .meta{font-size:13px;color:#53627a;margin-top:3px}
.item button{width:auto;margin:0;min-width:72px}.empty{padding:18px 0;color:#65738a;text-align:center}
.notice{font-size:13px;line-height:1.6;color:#53627a}.hidden{display:none!important}
@media(min-width:600px){main{padding:24px}.panel{padding:20px}}
</style>
</head>
<body>
<header><h1>部屋番号・エレベーター検索</h1><p>部屋番号からエレベーターをすばやく確認</p></header>
<main>
<div class="panel">
<label for="building">マンション</label>
<div class="row"><div><select id="building"></select></div><div style="flex:0 0 112px"><button id="addBuilding" class="btn secondary" style="margin-top:0">＋ 追加</button></div></div>
</div>
<nav aria-label="メニュー">
<button class="active" data-tab="search">🔍 検索</button>
<button data-tab="manage">✚ 部屋を登録</button>
<button data-tab="list">📋 登録済みリスト</button>
<button data-tab="backup">💾 保存・バックアップ</button>
</nav>
<section id="tab-search">
<div class="panel">
<h2>部屋番号を検索</h2>
<label for="query">部屋番号</label>
<input id="query" inputmode="numeric" placeholder="例：201" autocomplete="off">
<div id="searchResult" aria-live="polite"><p class="empty">部屋番号を入力してください。</p></div>
</div>
</section>
<section id="tab-manage" class="hidden">
<div class="panel">
<h2>部屋番号を登録</h2>
<p class="notice">同じ部屋番号に複数のエレベーターを割り当てることもできます。</p>
<label for="roomInput">部屋番号</label><input id="roomInput" placeholder="例：201">
<label for="elevatorInput">エレベーター名</label><input id="elevatorInput" placeholder="例：E-1">
<button id="saveRoom" class="btn primary">登録する</button>
</div>
</section>
<section id="tab-list" class="hidden">
<div class="panel"><h2>登録済みの部屋番号</h2><div id="roomList"></div></div>
</section>
<section id="tab-backup" class="hidden">
<div class="panel">
<h2>データの保存・バックアップ</h2>
<p class="notice">データはこのブラウザ内に保存されます。ブラウザのデータ消去や端末故障に備え、定期的にバックアップを保存してください。</p>
<button id="exportData" class="btn primary">バックアップを書き出す（JSON）</button>
<label for="importFile">バックアップを読み込む</label><input type="file" id="importFile" accept=".json,application/json">
<p class="notice">この試作版では、ブラウザ内に保存します。iPhoneのホーム画面アプリとしてのオフライン利用は、後でWeb公開・PWA設定を行う必要があります。</p>
</div>
</section>
</main>
<script>
(function(){
const KEY='elevatorFinderDataV1';
const initial={activeBuilding:'sample',buildings:[{id:'sample',name:'サンプルマンション',rooms:[
{room:'101',elevator:'E-1'},{room:'201',elevator:'E-1'},{room:'202',elevator:'E-1'},{room:'301',elevator:'E-1'},
{room:'102',elevator:'E-2'},{room:'203',elevator:'E-2'},{room:'204',elevator:'E-2'},{room:'303',elevator:'E-2'},{room:'304',elevator:'E-2'}
]}],saved:[]};
let data;
try{data=JSON.parse(localStorage.getItem(KEY))||initial}catch(e){data=initial}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存できませんでした。バックアップを書き出してください。')}}
function building(){return data.buildings.find(b=>b.id===data.activeBuilding)||data.buildings[0]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderBuildings(){
 const sel=document.getElementById('building');sel.innerHTML='';
 data.buildings.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;sel.appendChild(o)});
 sel.value=data.activeBuilding;
}
function renderResult(){
 const q=document.getElementById('query').value.trim();const box=document.getElementById('searchResult');
 if(!q){box.innerHTML='<p class="empty">部屋番号を入力してください。</p>';return}
 const matches=building().rooms.filter(r=>r.room.toLowerCase()===q.toLowerCase());
 if(!matches.length){box.innerHTML='<p class="empty">該当する部屋番号がありません。部屋番号を登録してください。</p>';return}
 box.innerHTML=matches.map((r,i)=>`<div class="result"><div class="room">${esc(r.room)}号室</div><div class="elevator">${esc(r.elevator)}</div><p class="small">マンション：${esc(building().name)}</p><button class="btn primary" data-save="${i}">リストに登録</button></div>`).join('');
 box.querySelectorAll('[data-save]').forEach((btn,i)=>btn.addEventListener('click',()=>{
 const r=matches[i];if(!data.saved.some(x=>x.buildingId===building().id&&x.room===r.room&&x.elevator===r.elevator)){data.saved.push({buildingId:building().id,buildingName:building().name,room:r.room,elevator:r.elevator});persist();renderList();btn.textContent='登録しました';btn.disabled=true}else{btn.textContent='登録済み';btn.disabled=true}
 }));
}
function renderList(){
 const box=document.getElementById('roomList');const order=['W-9','W-8','W-7','C-6','C-5','C-4','E-3','E-2','E-1'];const items=data.saved.filter(x=>x.buildingId===building().id).sort((a,b)=>{const ai=order.indexOf(a.elevator),bi=order.indexOf(b.elevator);const ar=ai<0?999:ai,br=bi<0?999:bi;return ar-br||(Number(a.room)-Number(b.room))||a.room.localeCompare(b.room,'ja');});
 if(!items.length){box.innerHTML='<p class="empty">まだ登録されていません。検索結果から登録できます。</p>';return}
 box.innerHTML=items.map((x,i)=>`<div class="item"><div><strong>${esc(x.room)}号室　${esc(x.elevator)}</strong><div class="meta">${esc(x.buildingName||'')}</div></div><button class="btn danger" data-delete="${i}">削除</button></div>`).join('');
 box.querySelectorAll('[data-delete]').forEach((btn,i)=>btn.addEventListener('click',()=>{const target=items[i];data.saved=data.saved.filter(x=>!(x.buildingId===target.buildingId&&x.room===target.room&&x.elevator===target.elevator));persist();renderList()}));
}
function showTab(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['search','manage','list','backup'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('hidden',t!==name));if(name==='list')renderList()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
document.getElementById('building').addEventListener('change',e=>{data.activeBuilding=e.target.value;persist();renderResult();renderList()});
document.getElementById('query').addEventListener('input',renderResult);
document.getElementById('saveRoom').addEventListener('click',()=>{
 const room=document.getElementById('roomInput').value.trim(), elevator=document.getElementById('elevatorInput').value.trim();
 if(!room||!elevator){alert('部屋番号とエレベーター名を入力してください。');return}
 const b=building();const exists=b.rooms.some(r=>r.room.toLowerCase()===room.toLowerCase()&&r.elevator.toLowerCase()===elevator.toLowerCase());
 if(exists){alert('この部屋番号とエレベーターは登録済みです。');return}
 b.rooms.push({room,elevator});persist();document.getElementById('roomInput').value='';document.getElementById('elevatorInput').value='';renderResult();renderList();alert(room+'号室を'+elevator+'として登録しました。');
});
document.getElementById('addBuilding').addEventListener('click',()=>{
 const name=prompt('マンション名を入力してください');if(!name||!name.trim())return;
 const id='b'+Date.now();data.buildings.push({id,name:name.trim(),rooms:[]});data.activeBuilding=id;persist();renderBuildings();renderResult();renderList();
});
document.getElementById('exportData').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='elevator-finder-backup.json';a.click();URL.revokeObjectURL(url);
});
document.getElementById('importFile').addEventListener('change',async e=>{
 const file=e.target.files[0];if(!file)return;
 try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.buildings)||!Array.isArray(parsed.saved))throw new Error();if(!confirm('現在のデータをバックアップ内容で置き換えますか？'))return;data=parsed;persist();renderBuildings();renderResult();renderList();alert('バックアップを読み込みました。')}catch(err){alert('ファイルを読み込めませんでした。正しいバックアップJSONを選んでください。')}e.target.value='';
});
renderBuildings();renderResult();renderList();persist();
})();
</script>
</body>
</html>
